<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow · 工作任务管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #16161d;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --accent: #7c6af7;
    --accent2: #f76a8c;
    --accent3: #6af7c8;
    --text: #e8e8f0;
    --text2: #8888a8;
    --text3: #5a5a78;
    --done: #2a3a2a;
    --done-text: #6af79a;
    --warn: #3a2a1a;
    --warn-text: #f7c46a;
    --urgent: #3a1a1a;
    --urgent-text: #f76a6a;
    --radius: 10px;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 28px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .logo span { color: var(--accent2); }
  .header-search {
    flex: 1;
    max-width: 380px;
    position: relative;
  }
  .header-search input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px 7px 34px;
    color: var(--text);
    font-size: .92rem;
    font-family: var(--sans);
    outline: none;
    transition: border .2s;
  }
  .header-search input:focus { border-color: var(--accent); }
  .header-search input::placeholder { color: var(--text3); }
  .header-search .ico {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3); font-size: 1rem;
  }
  .header-stats {
    display: flex; gap: 14px; margin-left: auto; align-items: center;
  }
  .stat-pill {
    font-family: var(--mono);
    font-size: .78rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text2);
    display: flex; gap: 6px; align-items: center;
  }
  .stat-pill b { color: var(--text); }
  #clock {
    font-family: var(--mono);
    font-size: .88rem;
    color: var(--text2);
    letter-spacing: 1px;
  }

  /* ── LAYOUT ── */
  .app {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 56px);
  }

  /* ── SIDEBAR ── */
  aside {
    width: 210px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    gap: 2px;
    overflow-y: auto;
  }
  .aside-section { padding: 14px 16px 4px; }
  .aside-label {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: 2px;
    color: var(--text3);
    text-transform: uppercase;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 0;
    color: var(--text2);
    font-size: .9rem;
    transition: background .15s, color .15s;
    user-select: none;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    background: var(--surface2);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .nav-item .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: .7rem;
    padding: 1px 7px;
    color: var(--text2);
  }
  .nav-item.active .badge { background: var(--accent); color: #fff; border-color: var(--accent); }

  .tag-list { padding: 4px 10px; }
  .tag-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
    color: var(--text2);
    transition: background .15s;
  }
  .tag-btn:hover { background: var(--surface2); color: var(--text); }
  .tag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .toolbar h2 {
    font-size: 1rem; font-weight: 700;
    font-family: var(--mono);
    color: var(--text);
    letter-spacing: .5px;
  }
  .toolbar-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 7px;
    font-size: .85rem;
    font-family: var(--sans);
    cursor: pointer;
    border: none;
    transition: opacity .2s, transform .1s;
    font-weight: 500;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text3); }

  /* filter row */
  .filter-row {
    display: flex; gap: 6px; align-items: center;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: .8rem;
    cursor: pointer;
    color: var(--text2);
    background: transparent;
    font-family: var(--sans);
    transition: all .15s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sort-select {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: .8rem;
    padding: 4px 10px;
    font-family: var(--sans);
    cursor: pointer;
    outline: none;
  }

  /* ── TASK LIST ── */
  .task-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px 40px;
  }
  .task-area::-webkit-scrollbar { width: 5px; }
  .task-area::-webkit-scrollbar-track { background: transparent; }
  .task-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* group */
  .group-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0 6px;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
    cursor: pointer;
    user-select: none;
  }
  .group-header .line { flex: 1; height: 1px; background: var(--border); }

  /* task card */
  .task-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    animation: slideIn .25s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .task-card:hover { border-color: var(--accent); background: var(--surface2); }
  .task-card.done { opacity: .5; }
  .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }

  /* priority stripe */
  .task-card.p-urgent { border-left: 3px solid var(--accent2); }
  .task-card.p-high   { border-left: 3px solid #f7a06a; }
  .task-card.p-medium { border-left: 3px solid var(--accent); }
  .task-card.p-low    { border-left: 3px solid var(--text3); }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .task-check:hover { border-color: var(--accent3); }
  .task-check.checked { background: var(--accent3); border-color: var(--accent3); }
  .task-check.checked::after { content: '✓'; font-size: .7rem; color: #0f0f13; font-weight: 700; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: .92rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    word-break: break-all;
  }
  .task-desc {
    font-size: .8rem;
    color: var(--text2);
    margin-bottom: 6px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .task-meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .meta-chip {
    font-size: .72rem;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: var(--mono);
  }
  .meta-chip.due-ok { color: var(--accent3); border-color: var(--accent3); }
  .meta-chip.due-warn { color: var(--warn-text); border-color: var(--warn-text); }
  .meta-chip.due-urgent { color: var(--urgent-text); border-color: var(--urgent-text); }
  .meta-chip.due-past { background: var(--urgent); color: var(--accent2); border-color: var(--accent2); }

  .priority-badge {
    font-size: .7rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-family: var(--mono);
  }
  .p-urgent .priority-badge { background: var(--urgent); color: var(--accent2); }
  .p-high   .priority-badge { background: #3a2018; color: #f7a06a; }
  .p-medium .priority-badge { background: #1a1a3a; color: var(--accent); }
  .p-low    .priority-badge { background: transparent; color: var(--text3); border: 1px solid var(--border); }

  .task-actions {
    display: flex; gap: 4px; flex-shrink: 0; margin-top: 1px;
  }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.del:hover { color: var(--accent2); }

  /* empty state */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 0;
    color: var(--text3);
    gap: 10px;
    font-size: .9rem;
  }
  .empty .big { font-size: 2.5rem; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    padding: 28px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 {
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .modal h3 .close {
    margin-left: auto;
    cursor: pointer;
    color: var(--text3);
    font-size: 1.2rem;
  }
  .modal h3 .close:hover { color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: .78rem;
    color: var(--text2);
    margin-bottom: 5px;
    font-family: var(--mono);
    letter-spacing: .5px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: .9rem;
    font-family: var(--sans);
    outline: none;
    transition: border .2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select { cursor: pointer; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 20px;
  }

  /* ── REMINDER badge ── */
  .reminder-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2);
    display: inline-block;
    margin-left: 2px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: .88rem;
    color: var(--text);
    z-index: 300;
    display: none;
    animation: slideUp .3s ease;
    max-width: 320px;
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
    transition: width .25s;
  }
  .detail-panel.hidden { width: 0; padding: 0; overflow: hidden; border: none; }
  .detail-panel h4 {
    font-family: var(--mono);
    font-size: .8rem;
    letter-spacing: 1px;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .detail-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    word-break: break-all;
  }
  .detail-desc {
    font-size: .85rem;
    color: var(--text2);
    margin-bottom: 16px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .detail-row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 10px;
    font-size: .83rem;
    color: var(--text2);
  }
  .detail-row .key { color: var(--text3); font-family: var(--mono); font-size: .75rem; min-width: 60px; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; flex: 1; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent3); border-radius: 2px; transition: width .3s; }
  .notes-area {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: .83rem;
    color: var(--text2);
    resize: none;
    font-family: var(--sans);
    outline: none;
    min-height: 100px;
  }
  .notes-area:focus { border-color: var(--accent); }

  @media (max-width: 768px) {
    aside { width: 52px; }
    .aside-label, .nav-item span, .tag-btn span, .aside-section { display: none; }
    .nav-item { justify-content: center; padding: 10px; }
    .detail-panel { display: none; }
    .header-stats .stat-pill:first-child { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Task<span>Flow</span></div>
  <div class="header-search">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索任务…" oninput="applyFilters()">
  </div>
  <div class="header-stats">
    <div class="stat-pill">待办 <b id="statTodo">0</b></div>
    <div class="stat-pill">今日到期 <b id="statToday">0</b></div>
    <div class="stat-pill">逾期 <b id="statOverdue" style="color:var(--accent2)">0</b></div>
    <div id="clock"></div>
  </div>
</header>

<div class="app">
<!-- SIDEBAR -->
<aside>
  <div class="aside-section"><div class="aside-label">视图</div></div>
  <div class="nav-item active" onclick="setView('all',this)" id="nav-all">
    <span>📋</span><span>全部任务</span><span class="badge" id="b-all">0</span>
  </div>
  <div class="nav-item" onclick="setView('today',this)" id="nav-today">
    <span>📅</span><span>今天</span><span class="badge" id="b-today">0</span>
  </div>
  <div class="nav-item" onclick="setView('urgent',this)" id="nav-urgent">
    <span>🔥</span><span>紧急</span><span class="badge" id="b-urgent">0</span>
  </div>
  <div class="nav-item" onclick="setView('upcoming',this)" id="nav-upcoming">
    <span>🗓</span><span>未来7天</span><span class="badge" id="b-upcoming">0</span>
  </div>
  <div class="nav-item" onclick="setView('done',this)" id="nav-done">
    <span>✅</span><span>已完成</span><span class="badge" id="b-done">0</span>
  </div>
  <div class="nav-item" onclick="setView('overdue',this)" id="nav-overdue">
    <span>⚠️</span><span>已逾期</span><span class="badge" id="b-overdue">0</span>
  </div>

  <div class="aside-section" style="margin-top:8px"><div class="aside-label">标签</div></div>
  <div class="tag-list" id="tagList"></div>
</aside>

<!-- MAIN -->
<main>
  <div class="toolbar">
    <h2 id="viewTitle">全部任务</h2>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-ghost" onclick="exportData()">⬇ 导出</button>
    <button class="btn btn-primary" onclick="openAddModal()">＋ 新建任务</button>
  </div>
  <div class="filter-row">
    <button class="filter-chip active" onclick="setPriFilter('all',this)">全部</button>
    <button class="filter-chip" onclick="setPriFilter('urgent',this)">🔥 紧急</button>
    <button class="filter-chip" onclick="setPriFilter('high',this)">❗ 高</button>
    <button class="filter-chip" onclick="setPriFilter('medium',this)">● 中</button>
    <button class="filter-chip" onclick="setPriFilter('low',this)">○ 低</button>
    <select class="sort-select" onchange="currentSort=this.value;applyFilters()">
      <option value="created">按创建时间</option>
      <option value="due">按截止日期</option>
      <option value="priority">按优先级</option>
      <option value="title">按标题</option>
    </select>
  </div>
  <div class="task-area" id="taskArea"></div>
</main>

<!-- DETAIL PANEL -->
<div class="detail-panel hidden" id="detailPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h4>任务详情</h4>
    <span class="icon-btn" onclick="closeDetail()" style="font-size:1rem">✕</span>
  </div>
  <div class="detail-title" id="d-title"></div>
  <div class="detail-desc" id="d-desc"></div>
  <div class="detail-row"><span class="key">优先级</span><span id="d-pri"></span></div>
  <div class="detail-row"><span class="key">截止</span><span id="d-due"></span></div>
  <div class="detail-row"><span class="key">标签</span><span id="d-tags"></span></div>
  <div class="detail-row"><span class="key">进度</span>
    <div class="progress-bar"><div class="progress-fill" id="d-prog"></div></div>
    <span id="d-prog-num" style="font-size:.75rem;color:var(--text3);margin-left:6px;font-family:var(--mono)"></span>
  </div>
  <div style="margin-top:4px;margin-bottom:6px;font-size:.75rem;color:var(--text3);font-family:var(--mono)">进度调整</div>
  <input type="range" id="d-prog-range" min="0" max="100" style="width:100%;accent-color:var(--accent3);margin-bottom:16px" oninput="updateProgress(this.value)">
  <h4 style="margin-bottom:6px">备注</h4>
  <textarea class="notes-area" id="d-notes" placeholder="添加备注…" oninput="saveNotes(this.value)"></textarea>
  <div style="margin-top:14px;display:flex;gap:8px">
    <button class="btn btn-ghost" style="flex:1" onclick="editFromDetail()">✏ 编辑</button>
    <button class="btn btn-ghost" style="flex:1;color:var(--accent2)" onclick="deleteFromDetail()">🗑 删除</button>
  </div>
</div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>
      <span id="modalTitle">新建任务</span>
      <span class="close" onclick="closeModal()">✕</span>
    </h3>
    <div class="field">
      <label>任务标题 *</label>
      <input type="text" id="f-title" placeholder="输入任务标题…">
    </div>
    <div class="field">
      <label>描述</label>
      <textarea id="f-desc" placeholder="补充说明、步骤…"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>优先级</label>
        <select id="f-pri">
          <option value="urgent">🔥 紧急</option>
          <option value="high">❗ 高</option>
          <option value="medium" selected>● 中</option>
          <option value="low">○ 低</option>
        </select>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="f-due">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>分类标签（逗号分隔）</label>
        <input type="text" id="f-tags" placeholder="如: 开发, 会议">
      </div>
      <div class="field">
        <label>预计工时（小时）</label>
        <input type="number" id="f-hours" min="0" step="0.5" placeholder="0">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTask()">保存任务</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
let tasks = JSON.parse(localStorage.getItem('tf_tasks') || '[]');
let currentView = 'all';
let currentPriFilter = 'all';
let currentSort = 'created';
let editingId = null;
let detailId = null;

function save() {
  localStorage.setItem('tf_tasks', JSON.stringify(tasks));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,5);
}

/* ═══════════════════════════════════════════
   CLOCK + REMINDERS
═══════════════════════════════════════════ */
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tick, 1000); tick();

// Browser notification reminder (check every minute)
if ('Notification' in window) Notification.requestPermission();
setInterval(() => {
  const now = new Date();
  const todayStr = toDateStr(now);
  tasks.filter(t => !t.done && t.due && !t.reminded).forEach(t => {
    const d = new Date(t.due);
    const diff = (d - now) / 60000;
    if (diff > 0 && diff <= 60) {
      t.reminded = true;
      save();
      if (Notification.permission === 'granted') {
        new Notification('TaskFlow 提醒', { body: `任务「${t.title}」将在1小时内到期！`, icon: '' });
      }
      toast(`⏰ 提醒：「${t.title}」即将到期`);
    }
  });
}, 60000);

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function toDateStr(d) {
  return d.toISOString().slice(0,10);
}
function todayStr() { return toDateStr(new Date()); }
function daysFromNow(str) {
  if (!str) return null;
  const d = new Date(str); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function dueClass(str, done) {
  if (done || !str) return '';
  const n = daysFromNow(str);
  if (n < 0) return 'due-past';
  if (n === 0) return 'due-urgent';
  if (n <= 2) return 'due-warn';
  return 'due-ok';
}
function dueLabel(str) {
  if (!str) return '';
  const n = daysFromNow(str);
  if (n < 0) return `逾期 ${-n} 天`;
  if (n === 0) return '今天到期';
  if (n === 1) return '明天到期';
  return `${str} (${n}天后)`;
}
const priOrder = { urgent:0, high:1, medium:2, low:3 };
const priLabel = { urgent:'🔥 紧急', high:'❗ 高', medium:'● 中', low:'○ 低' };

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

/* ═══════════════════════════════════════════
   VIEWS & FILTERS
═══════════════════════════════════════════ */
function setView(v, el) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const titles = { all:'全部任务', today:'今天', urgent:'紧急任务', upcoming:'未来7天', done:'已完成', overdue:'已逾期' };
  document.getElementById('viewTitle').textContent = titles[v] || v;
  applyFilters();
}
function setPriFilter(p, el) {
  currentPriFilter = p;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}
function getViewTasks() {
  const today = todayStr();
  const in7 = toDateStr(new Date(Date.now() + 7*86400000));
  switch (currentView) {
    case 'today':    return tasks.filter(t => !t.done && t.due === today);
    case 'urgent':   return tasks.filter(t => !t.done && t.priority === 'urgent');
    case 'upcoming': return tasks.filter(t => !t.done && t.due && t.due > today && t.due <= in7);
    case 'done':     return tasks.filter(t => t.done);
    case 'overdue':  return tasks.filter(t => !t.done && t.due && t.due < today);
    default:         return [...tasks];
  }
}
function applyFilters() {
  let list = getViewTasks();
  // search
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (q) list = list.filter(t =>
    t.title.toLowerCase().includes(q) ||
    (t.desc||'').toLowerCase().includes(q) ||
    (t.tags||[]).some(g => g.toLowerCase().includes(q))
  );
  // priority
  if (currentPriFilter !== 'all') list = list.filter(t => t.priority === currentPriFilter);
  // sort
  list.sort((a,b) => {
    if (currentSort === 'priority') return (priOrder[a.priority]||2) - (priOrder[b.priority]||2);
    if (currentSort === 'due') {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1; if (!b.due) return -1;
      return a.due.localeCompare(b.due);
    }
    if (currentSort === 'title') return a.title.localeCompare(b.title);
    return b.created - a.created;
  });
  renderTasks(list);
  updateStats();
  renderTags();
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function renderTasks(list) {
  const area = document.getElementById('taskArea');
  if (!list.length) {
    area.innerHTML = `<div class="empty"><div class="big">📭</div><div>没有找到任务</div></div>`;
    return;
  }

  // Group by date or no-group
  if (currentSort === 'due') {
    const groups = {};
    list.forEach(t => {
      const k = t.due || '_nodate';
      if (!groups[k]) groups[k] = [];
      groups[k].push(t);
    });
    let html = '';
    Object.keys(groups).sort().forEach(k => {
      const label = k === '_nodate' ? '无截止日期' : (() => {
        const n = daysFromNow(k);
        if (n < 0) return `⚠ 逾期 — ${k}`;
        if (n === 0) return `📅 今天 — ${k}`;
        if (n === 1) return `📅 明天 — ${k}`;
        return `🗓 ${k}`;
      })();
      html += `<div class="group-header"><div class="line"></div><span>${label}</span><div class="line"></div></div>`;
      groups[k].forEach(t => { html += taskCardHTML(t); });
    });
    area.innerHTML = html;
  } else {
    area.innerHTML = list.map(taskCardHTML).join('');
  }
}

function taskCardHTML(t) {
  const dc = dueClass(t.due, t.done);
  const dueHTML = t.due
    ? `<span class="meta-chip ${dc}">${dueLabel(t.due)}</span>` : '';
  const tagsHTML = (t.tags||[]).map(g =>
    `<span class="meta-chip" style="cursor:pointer" onclick="filterByTag('${g}')">${g}</span>`
  ).join('');
  const hoursHTML = t.hours ? `<span class="meta-chip">⏱ ${t.hours}h</span>` : '';
  const prog = t.progress || 0;
  const progHTML = prog > 0
    ? `<span class="meta-chip" style="color:var(--accent3);border-color:var(--accent3)">${prog}%</span>` : '';
  const reminderDot = dc === 'due-urgent' || dc === 'due-past'
    ? `<span class="reminder-dot"></span>` : '';

  return `
  <div class="task-card p-${t.priority}${t.done?' done':''}" id="card-${t.id}" onclick="openDetail('${t.id}')">
    <div class="task-check${t.done?' checked':''}" onclick="event.stopPropagation();toggleDone('${t.id}')"></div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}${reminderDot}</div>
      ${t.desc ? `<div class="task-desc">${esc(t.desc).slice(0,120)}${t.desc.length>120?'…':''}</div>` : ''}
      <div class="task-meta">
        <span class="priority-badge">${priLabel[t.priority]||t.priority}</span>
        ${dueHTML}${tagsHTML}${hoursHTML}${progHTML}
      </div>
    </div>
    <div class="task-actions">
      <button class="icon-btn" title="编辑" onclick="event.stopPropagation();openEdit('${t.id}')">✏</button>
      <button class="icon-btn del" title="删除" onclick="event.stopPropagation();deleteTask('${t.id}')">🗑</button>
    </div>
  </div>`;
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateStats() {
  const today = todayStr();
  const todo = tasks.filter(t => !t.done).length;
  const td   = tasks.filter(t => !t.done && t.due === today).length;
  const ov   = tasks.filter(t => !t.done && t.due && t.due < today).length;
  document.getElementById('statTodo').textContent    = todo;
  document.getElementById('statToday').textContent   = td;
  document.getElementById('statOverdue').textContent = ov;

  const badges = {
    all: tasks.length,
    today: td,
    urgent: tasks.filter(t=>!t.done&&t.priority==='urgent').length,
    upcoming: tasks.filter(t=>!t.done&&t.due&&t.due>today&&t.due<=toDateStr(new Date(Date.now()+7*86400000))).length,
    done: tasks.filter(t=>t.done).length,
    overdue: ov
  };
  Object.entries(badges).forEach(([k,v]) => {
    const el = document.getElementById('b-'+k);
    if (el) el.textContent = v;
  });
}

function renderTags() {
  const all = {};
  tasks.forEach(t => (t.tags||[]).forEach(g => { all[g] = (all[g]||0)+1; }));
  const colors = ['#7c6af7','#f76a8c','#6af7c8','#f7c46a','#6ab8f7','#f7a06a'];
  document.getElementById('tagList').innerHTML = Object.entries(all).map(([g,c],i) =>
    `<div class="tag-btn" onclick="filterByTag('${g}')">
      <span class="tag-dot" style="background:${colors[i%colors.length]}"></span>
      <span>${g}</span>
      <span style="margin-left:auto;font-size:.7rem;color:var(--text3)">${c}</span>
    </div>`
  ).join('');
}
function filterByTag(tag) {
  document.getElementById('searchInput').value = tag;
  applyFilters();
}

/* ═══════════════════════════════════════════
   TASK CRUD
═══════════════════════════════════════════ */
function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.progress = t.done ? 100 : t.progress;
  save(); applyFilters();
  toast(t.done ? `✅ 已完成「${t.title}」` : `↩ 已恢复「${t.title}」`);
  if (detailId === id) openDetail(id);
}
function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`确定删除「${t.title}」？`)) return;
  tasks = tasks.filter(x => x.id !== id);
  save(); applyFilters();
  if (detailId === id) closeDetail();
  toast(`🗑 已删除「${t.title}」`);
}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新建任务';
  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-pri').value = 'medium';
  document.getElementById('f-due').value = '';
  document.getElementById('f-tags').value = '';
  document.getElementById('f-hours').value = '';
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}
function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑任务';
  document.getElementById('f-title').value = t.title;
  document.getElementById('f-desc').value = t.desc || '';
  document.getElementById('f-pri').value = t.priority || 'medium';
  document.getElementById('f-due').value = t.due || '';
  document.getElementById('f-tags').value = (t.tags||[]).join(', ');
  document.getElementById('f-hours').value = t.hours || '';
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}
function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); toast('⚠ 请输入任务标题'); return; }
  const tags = document.getElementById('f-tags').value
    .split(',').map(s=>s.trim()).filter(Boolean);
  if (editingId) {
    const t = tasks.find(x => x.id === editingId);
    t.title    = title;
    t.desc     = document.getElementById('f-desc').value.trim();
    t.priority = document.getElementById('f-pri').value;
    t.due      = document.getElementById('f-due').value;
    t.tags     = tags;
    t.hours    = parseFloat(document.getElementById('f-hours').value) || 0;
    t.reminded = false;
  } else {
    tasks.unshift({
      id: uid(), title,
      desc:     document.getElementById('f-desc').value.trim(),
      priority: document.getElementById('f-pri').value,
      due:      document.getElementById('f-due').value,
      tags, done: false,
      hours:    parseFloat(document.getElementById('f-hours').value) || 0,
      progress: 0, notes: '',
      created:  Date.now(), reminded: false
    });
  }
  save(); closeModal(); applyFilters();
  toast(editingId ? '✏ 任务已更新' : '➕ 任务已创建');
  if (detailId === editingId) openDetail(editingId);
}

/* ═══════════════════════════════════════════
   DETAIL PANEL
═══════════════════════════════════════════ */
function openDetail(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  detailId = id;
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');
  document.getElementById('d-title').textContent = t.title;
  document.getElementById('d-desc').textContent = t.desc || '（无描述）';
  document.getElementById('d-pri').textContent = priLabel[t.priority] || t.priority;
  document.getElementById('d-due').textContent = t.due ? dueLabel(t.due) : '无截止';
  document.getElementById('d-tags').textContent = (t.tags||[]).join(', ') || '无标签';
  const prog = t.progress || 0;
  document.getElementById('d-prog').style.width = prog + '%';
  document.getElementById('d-prog-num').textContent = prog + '%';
  document.getElementById('d-prog-range').value = prog;
  document.getElementById('d-notes').value = t.notes || '';
}
function closeDetail() {
  detailId = null;
  document.getElementById('detailPanel').classList.add('hidden');
}
function updateProgress(v) {
  if (!detailId) return;
  const t = tasks.find(x => x.id === detailId);
  if (!t) return;
  t.progress = parseInt(v);
  document.getElementById('d-prog').style.width = v + '%';
  document.getElementById('d-prog-num').textContent = v + '%';
  save(); applyFilters();
}
function saveNotes(v) {
  if (!detailId) return;
  const t = tasks.find(x => x.id === detailId);
  if (t) { t.notes = v; save(); }
}
function editFromDetail() { if (detailId) openEdit(detailId); }
function deleteFromDetail() { if (detailId) deleteTask(detailId); }

/* ═══════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════ */
function exportData() {
  const rows = ['标题,描述,优先级,截止日期,标签,进度,完成'];
  tasks.forEach(t => {
    rows.push([t.title, t.desc||'', priLabel[t.priority]||t.priority, t.due||'', (t.tags||[]).join('|'), (t.progress||0)+'%', t.done?'是':'否'].map(s=>`"${s}"`).join(','));
  });
  const blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `taskflow_${todayStr()}.csv`;
  a.click();
  toast('⬇ 已导出 CSV');
}

/* ═══════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); openAddModal(); }
  if (e.key==='Escape') { closeModal(); closeDetail(); }
});

/* ═══════════════════════════════════════════
   SEED DEMO DATA (first run)
═══════════════════════════════════════════ */
if (!tasks.length) {
  const d = n => toDateStr(new Date(Date.now() + n*86400000));
  tasks = [
    { id:uid(), title:'完成Q2季度报告', desc:'汇总各部门数据，制作PPT，提交给总监', priority:'urgent', due:d(1), tags:['报告','管理'], done:false, hours:4, progress:60, notes:'已完成数据汇总，待制作PPT', created:Date.now()-5e6, reminded:false },
    { id:uid(), title:'与客户召开产品评审会', desc:'准备演示材料，确认参会人员', priority:'high', due:d(2), tags:['客户','会议'], done:false, hours:2, progress:30, notes:'', created:Date.now()-4e6, reminded:false },
    { id:uid(), title:'修复登录页面BUG', desc:'Safari浏览器下按钮错位问题', priority:'urgent', due:d(0), tags:['开发','BUG'], done:false, hours:1, progress:0, notes:'', created:Date.now()-3e6, reminded:false },
    { id:uid(), title:'更新用户手册文档', desc:'新增v2.3版本功能说明', priority:'medium', due:d(5), tags:['文档'], done:false, hours:3, progress:10, notes:'', created:Date.now()-2e6, reminded:false },
    { id:uid(), title:'周五团队周会', desc:'汇报本周进展，规划下周计划', priority:'medium', due:d(4), tags:['会议','管理'], done:false, hours:1, progress:0, notes:'', created:Date.now()-1e6, reminded:false },
    { id:uid(), title:'采购办公耗材', desc:'打印纸、签字笔、订书钉', priority:'low', due:d(7), tags:['行政'], done:false, hours:0.5, progress:0, notes:'', created:Date.now()-8e5, reminded:false },
    { id:uid(), title:'完成竞品分析报告', desc:'对比5款同类产品功能、价格、用户口碑', priority:'high', due:d(-2), tags:['产品','报告'], done:false, hours:6, progress:80, notes:'', created:Date.now()-7e5, reminded:false },
    { id:uid(), title:'同步HR关于调薪方案', desc:'', priority:'low', due:'', tags:['HR'], done:true, hours:0.5, progress:100, notes:'', created:Date.now()-6e5, reminded:false },
    { id:uid(), title:'迁移服务器数据库', desc:'将生产数据库迁移至新服务器，需在低峰期执行', priority:'urgent', due:d(3), tags:['开发','运维'], done:false, hours:8, progress:0, notes:'', created:Date.now()-5e5, reminded:false },
  ];
  save();
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
applyFilters();
</script>
</body>
</html>
